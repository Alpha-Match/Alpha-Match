plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'com.alpha'
version = '0.0.1-SNAPSHOT'
description = 'api-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springGrpcVersion', "1.0.3")
    set('testcontainersVersion', "1.20.4")
}


dependencies {
    // ===== Spring Boot Starters =====
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

    // ===== R2DBC (Reactive Database) =====
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql:1.0.5.RELEASE'

    // ===== PostgreSQL + pgvector =====
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.pgvector:pgvector:0.1.4'

    // ===== Cache =====
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // ===== gRPC =====
    implementation 'io.grpc:grpc-services'
    implementation 'io.grpc:grpc-stub'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter'

    // ===== Reactor =====
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.addons:reactor-extra'

    // ===== Jackson =====
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ===== Lombok =====
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // ===== Test =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.grpc:spring-grpc-test'
    testImplementation 'io.projectreactor:reactor-test'

    // R2DBC Test Support
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:r2dbc'
    testImplementation 'io.r2dbc:r2dbc-h2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
    dependencies {
        // testcontainers 1.20.x 전이 의존성 commons-compress 1.24.0 보안 권고 대응 (1.26.0 이상)
        dependency 'org.apache.commons:commons-compress:1.28.0'
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {
                option '@generated=omit'
            }
        }
    }
}

// ===== 보안 권고 대응: BOM이 관리하지 않는 전이 의존성 버전 지정 =====
// guava: grpc 전이 의존성 (CVE-2026-102554, 33.7.2 이상에서 수정). -jre/-android 변형을 유지한 채 버전만 올린다.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
            def flavor = details.requested.version?.endsWith('-android') ? 'android' : 'jre'
            details.useVersion("33.8.0-${flavor}")
            details.because('CVE-2026-102554 대응')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
